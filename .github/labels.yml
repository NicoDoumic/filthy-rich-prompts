# Label taxonomy for filthy-rich-prompts.
# Synced to GitHub via a label-sync action (e.g. crazy-max/ghaction-github-labeler)
# — the workflow lands in Phase 1 with CI. Until then, maintainers create these manually.
#
# Conventions:
#   type:*     what kind of work it is        (exactly one per issue/PR)
#   status:*   where it stands in the workflow
#   priority:* how urgently it needs attention (set at triage; critical = drop everything)
#   area:*     which part of the project       (one or more)
# Plus a small set of un-prefixed community labels.

# ── type ─────────────────────────────────────────────────────────────
- name: "type: bug"
  color: "d73a4a"
  description: "Incorrect behavior — intent drift, information loss, crashes, bad output"
- name: "type: feature"
  color: "1d76db"
  description: "New capability that isn't a refinement pass"
- name: "type: pass-proposal"
  color: "7c3aed"
  description: "Proposal for a new refinement pass — the highest-value contribution"
- name: "type: docs"
  color: "0e8a16"
  description: "Documentation improvements, corrections, examples"
- name: "type: chore"
  color: "c5def5"
  description: "Tooling, dependencies, CI, maintenance"
- name: "type: benchmark"
  color: "fb8500"
  description: "Dataset fixtures, eval harness, metric methodology"

# ── status ───────────────────────────────────────────────────────────
- name: "status: needs-triage"
  color: "e4e669"
  description: "New and unreviewed — maintainers sweep weekly"
- name: "status: accepted"
  color: "0e8a16"
  description: "Reviewed and approved for implementation"
- name: "status: in-progress"
  color: "1d76db"
  description: "Someone is actively working on this"
- name: "status: blocked"
  color: "b60205"
  description: "Cannot proceed — reason required in a comment"
- name: "status: needs-info"
  color: "e4e669"
  description: "Waiting on the reporter for reproduction details or answers"
- name: "status: wontfix"
  color: "ffffff"
  description: "Respectfully declined — rationale documented in the closing comment"
- name: "status: duplicate"
  color: "ffffff"
  description: "Already tracked elsewhere — link the canonical issue when applying"

# ── priority ─────────────────────────────────────────────────────────
- name: "priority: critical"
  color: "b60205"
  description: "Intent-preservation or data-loss class. Drop everything; deprecate if released"
- name: "priority: high"
  color: "d93f0b"
  description: "Should land in the next release"
- name: "priority: normal"
  color: "fbca04"
  description: "Default triage priority"
- name: "priority: low"
  color: "c2e0c6"
  description: "Worth doing, no urgency"

# ── area ─────────────────────────────────────────────────────────────
- name: "area: core"
  color: "0052cc"
  description: "Pipeline engine, context model, registry (src/core)"
- name: "area: passes"
  color: "0052cc"
  description: "Built-in refinement passes (src/passes)"
- name: "area: cli"
  color: "0052cc"
  description: "The frp command-line interface"
- name: "area: tui"
  color: "0052cc"
  description: "Interactive terminal UI"
- name: "area: config"
  color: "0052cc"
  description: "refine.config.json schema, resolution, validation"
- name: "area: plugins"
  color: "0052cc"
  description: "Plugin API, registry, trust model"
- name: "area: eval"
  color: "0052cc"
  description: "Benchmark harness, metrics, fixtures, adversarial suite"
- name: "area: docs"
  color: "0052cc"
  description: "Documentation site and repo docs"
- name: "area: skill-integration"
  color: "0052cc"
  description: "OpenCode skill loading, SKILL.md contract, smoke tests"

# ── community ────────────────────────────────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: "Curated entry point: clear scope, pointers, named maintainer to ping"
- name: "help wanted"
  color: "008672"
  description: "Maintainers would love a community PR for this"
- name: "breaking"
  color: "b60205"
  description: "Changes pass API, config schema, or CLI contract — needs migration notes"
- name: "no-changeset"
  color: "e4e669"
  description: "Docs/tests/CI-only PR exempt from the changeset requirement"
- name: "pinned"
  color: "1d76db"
  description: "Exempt from stale-bot cleanup"
