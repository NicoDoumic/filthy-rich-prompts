name: Release

# Changesets-driven releases (docs/versioning.md §3, docs/release-strategy.md §2):
# this workflow opens/updates a "Release: vX.Y.Z" PR; merging it publishes to
# npm with provenance and tags the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance (OIDC — no long-lived tokens)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality gates before any release
        run: |
          pnpm lint
          pnpm typecheck
          pnpm check:deps
          pnpm coverage
          pnpm build
          pnpm smoke:pack
        env:
          CI: true

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version
          publish: pnpm release
          title: "Release: v"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
