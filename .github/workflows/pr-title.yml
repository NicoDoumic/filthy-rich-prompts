name: PR Title

# Conventional Commit enforcement via the PR title (docs/development-workflow.md
# §2): squash-merge makes the PR title the commit message on main, so the title
# is the correct thing to lint.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            perf
            ci
          requireScope: false
